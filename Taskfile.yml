version: '3'

tasks:
  run:
    desc: Run the Go application directly
    cmds:
      - go run cmd/server/main.go

  build:
    desc: Build the Go application binary
    cmds:
      - go build -o bin/server.exe cmd/server/main.go

  test:
    desc: Run test suite
    cmds:
      - go test ./...

  bench:
    desc: Run micro-benchmarks with memory allocations
    cmds:
      - go test -bench=. -benchmem -run=^$ ./internal/handler/... ./internal/worker/...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  docker:
    desc: Build minimal Docker container
    cmds:
      - docker build -t telemetry-api:latest .
